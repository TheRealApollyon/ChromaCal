[pytest]
asyncio_mode = auto
; custom_components/chromacal is on the path so tests/scheduling/ can import
; `scheduling.*` directly, bypassing custom_components/chromacal/__init__.py
; (which imports homeassistant) -- that's what lets those tests run without
; homeassistant installed at all. tests/components/ still imports the normal
; custom_components.chromacal.* dotted path and needs the HA test harness.
pythonpath =
    .
    custom_components/chromacal
